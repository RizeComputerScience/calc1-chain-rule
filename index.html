<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The chain rule</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
:root{--bg:#F5F2EA;--surface:#FFFDF7;--ink:#1C1A16;--muted:#5A5549;--line:#DAD3C3;--soft:#ECE7DA;--inside:#1E58A3;--inside-tint:#E1EAF6;--outside:#A1430C;--outside-tint:#F6E5D6;--ok:#2B6838;--ok-tint:#E2F0E3;--k-tint:#EEDFB8;--k-line:#B8964A;--bad:#A3271B;--bad-tint:#F8E2DE;--focus:#1E58A3;--serif:'Newsreader','Iowan Old Style',Georgia,serif;--sans:'Source Sans 3','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--bg:#15140F;--surface:#1E1C18;--ink:#EDE8DC;--muted:#B3AC9D;--line:#3B372F;--soft:#27241E;--inside:#91B9F2;--inside-tint:#1B2840;--outside:#F2A56F;--outside-tint:#3A2617;--ok:#91CC9D;--ok-tint:#1C3020;--k-tint:#3B321C;--k-line:#9C8146;--bad:#F2958A;--bad-tint:#3D1C18;--focus:#91B9F2;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:21px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--inside);text-underline-offset:3px}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.page{padding:0 24px 160px}
.col{max-width:760px;margin-left:auto;margin-right:auto}
p{margin:0 0 16px;text-wrap:pretty}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-0.01em;margin:0}
.cap{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.muted{color:var(--muted)}
/* math typesetting: always inline flow, never flex items */
.mn,.mv,.mf,.mo,.ms{font-family:var(--serif)}
.mv{font-style:italic;padding-right:.05em}
.mo{white-space:nowrap}
.mo.eq{white-space:normal}
.ms{font-size:.7em;line-height:1;vertical-align:.65em}
.ms.msv{font-style:italic}
.em{font-style:italic}
.in{color:var(--inside)}
.mn.in,.mv.in,.mf.in,.mo.in{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-skip-ink:none}
.pr.in,.pr.out{font-weight:600}
.out{color:var(--outside)}
.k{color:var(--ink) !important;background:var(--k-tint);box-shadow:inset 0 -1.5px 0 var(--k-line);border-radius:4px;padding:0 .14em;margin:0 .02em;font-weight:500;text-decoration:none !important}
sup.k{padding:0 .1em}
/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -24px;padding:0 24px}
.bar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:60px;position:relative}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);text-decoration:none}
.toc{display:flex;gap:20px;flex:1;justify-content:center;font-family:var(--sans);font-size:16px}
.toc a{color:var(--muted);text-decoration:none;padding:6px 0}
.toc a:hover{color:var(--ink)}
.rulesbtn{margin-left:auto;font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;min-height:42px;padding:6px 18px;cursor:pointer;display:flex;gap:8px;align-items:center;position:relative;z-index:22}
.rulesbtn .n{color:var(--muted);font-weight:500}
.scrim{position:fixed;inset:0;z-index:21;background:transparent;border:0;padding:0;margin:0;cursor:default}
.drawer{position:absolute;right:0;top:calc(100% + 8px);z-index:23;width:min(460px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:0 18px 50px rgba(20,18,12,.18)}
.rules{list-style:none;margin:0;padding:0}
.rules li{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.rules li:first-child{border-top:0}
.rname{font-family:var(--sans);font-size:16px;color:var(--muted)}
.rules li.new .rname{color:var(--ink);font-weight:600}
.rf{font-size:22px}
.newtag{grid-column:2;font-family:var(--sans);font-size:14px;color:var(--muted)}
/* hero */
.hero{padding:88px 0 24px}
.kicker{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.hero h1{font-size:clamp(48px,8vw,84px);line-height:1;font-weight:500;margin-bottom:18px}
.dek{font-size:24px;line-height:1.5;color:var(--muted)}
.emblem{margin:52px 0 0;padding:44px 20px 32px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:26px}
.emb-row{font-family:var(--serif);font-size:clamp(56px,11vw,108px);line-height:1.1;display:flex;align-items:flex-start}
.emb-out{color:var(--outside)}
.emb-in{color:var(--inside);background:var(--inside-tint);border-radius:12px;padding:0 .14em;border-bottom:4px solid var(--inside);animation:breathe 4.5s ease-in-out infinite}
.emb-sup{font-size:.55em;color:var(--outside);margin-left:.04em}
.emb-legend{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center;font-family:var(--sans);font-size:17px}
.leg{display:flex;align-items:center;gap:10px}
.sw{width:30px;height:18px;border-radius:5px;flex:none}
.sw-in{background:var(--inside-tint);border-bottom:3px solid var(--inside)}
.sw-out{border:2px solid var(--outside)}
.leg b{font-weight:600}
.leg-in b{color:var(--inside)}.leg-out b{color:var(--outside)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(30,88,163,0)}50%{box-shadow:0 0 0 8px rgba(30,88,163,.10)}}
/* sections */
.sec{padding-top:160px;margin-bottom:12px}
.sec-top{display:flex;align-items:baseline;gap:18px;border-top:2px solid var(--ink);padding-top:18px}
.sec-n{font-family:var(--serif);font-size:60px;line-height:.9;color:var(--outside);font-weight:400}
.sec h2{font-size:clamp(34px,5vw,48px);line-height:1.1}
.lede{margin-top:12px;font-size:21px;color:var(--muted)}
.prose{margin-top:68px}
.prose h3{font-size:28px;margin-bottom:12px}
/* buttons */
.btn{font-family:var(--sans);font-size:17px;font-weight:600;min-height:48px;padding:10px 20px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:44px;padding:8px 16px;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{font-family:var(--sans);font-size:16px;font-weight:600;background:none;border:0;color:var(--inside);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px;cursor:pointer}
/* cards */
.prob,.scard,.exam{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 36px 30px;margin:44px auto 0;max-width:760px}
.prob-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:18px}
.plabel{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--muted)}
.ptask{font-family:var(--sans);font-size:17px;color:var(--muted)}
.pmath{font-size:29px;line-height:1.35}
.is-done .plabel::after{content:' \2713';color:var(--ok)}
.locked{font-family:var(--sans);font-size:16px;color:var(--muted);margin:0}
.is-locked{background:transparent;border-style:dashed}
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lhs{font-size:24px;white-space:nowrap}
.minput{flex:1 1 200px;min-width:0;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;min-height:54px;padding:10px 14px;width:100%}
.minput:focus{border-color:var(--inside);outline:none;box-shadow:0 0 0 3px var(--inside-tint)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:10px}
.key{font-family:var(--serif);font-size:19px;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0 4px}
.key:hover{border-color:var(--ink)}
.fb{font-family:var(--sans);font-size:17px;line-height:1.55;margin-top:10px}
.fb .mn,.fb .mv,.fb .mf,.fb .mo{font-size:20px}
.pv{font-family:var(--sans);font-size:16px;color:var(--muted);margin-top:6px}
.pv .mn,.pv .mv,.pv .mf,.pv .mo{font-size:19px}
.fb-ok{color:var(--ok);font-weight:600}
.fb-no::before,.fb-err::before,.fb-stuck::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--outside);margin-right:9px;vertical-align:2px}
.fb-err::before{background:var(--muted)}
.fb-stuck::before{background:var(--inside)}
.aft{display:flex;gap:10px;flex-wrap:wrap}
.sol{margin-top:12px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:20px}
.repair{margin-top:18px;padding:20px;background:var(--soft);border-radius:12px}
.repair .diag{font-size:19px}
.cap2{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted);margin:18px 0 6px}
.repair .pmath{font-size:24px}
.hintd{margin:0 0 16px;font-family:var(--sans);font-size:17px}
.hintd summary{font-weight:600;color:var(--inside);cursor:pointer;min-height:40px;display:flex;align-items:center}
.hintd p{margin:6px 0 4px;font-size:17px}
.hintd .mn,.hintd .mv,.hintd .mf,.hintd .mo{font-size:20px}
/* step rows */
.ctitle{font-family:var(--sans);font-size:19px;margin:0 0 18px}
.ctitle .mn,.ctitle .mv,.ctitle .mf,.ctitle .mo{font-size:27px}
.ctitle .ms{font-size:19px}
.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:28px minmax(0,10em) minmax(0,1fr);gap:8px 18px;align-items:start;padding:20px 0;border-top:1px solid var(--line)}
.srow.fixrow{grid-template-columns:28px minmax(0,9em) minmax(0,1fr) 120px}
.snum{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--muted);padding-top:15px}
.slabel{font-family:var(--sans);font-size:18px;line-height:1.35;padding-top:13px}
.slabel .mn,.slabel .mv,.slabel .mf,.slabel .mo{font-size:21px}
.sval{min-width:0}
.vrow{display:flex;align-items:flex-start;gap:10px}
.vrow > .sbox,.vrow > .minput{flex:1 1 auto;min-width:0}
.sbox{display:block;font-size:clamp(18px,2.9vw,24px);white-space:nowrap;overflow-x:auto;line-height:1.45;min-height:54px;padding:8px 16px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;width:100%;text-align:left;color:var(--ink)}
.sbox.given{border-style:dashed}
.sbox.good{border-color:var(--ok);background:var(--ok-tint)}
.sbox.bad{border-color:var(--bad);background:var(--bad-tint)}
.sbox.dim{opacity:.55}
.gtag,.etag{display:inline-block;margin-top:6px;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bmark{width:22px;flex:none;color:var(--ok);font-weight:700;font-family:var(--sans);padding-top:14px}
.srow.ok .minput{border-color:var(--ok)}
.srow .fb{margin-top:8px}
.rowacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.fixbtn{font-family:var(--sans);font-size:15px;font-weight:600;min-height:44px;width:100%;margin-top:5px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.fixbtn:hover{border-color:var(--ink)}
.fixbtn:disabled{opacity:.35;cursor:not-allowed}
.status{display:flex;align-items:flex-start;gap:12px;margin-top:20px;padding:16px 18px;border-radius:12px;font-family:var(--sans);font-size:17px;line-height:1.5}
.status .mn,.status .mv,.status .mf,.status .mo{font-size:20px}
.status .dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:5px}
.st-bad{background:var(--bad-tint)}.st-bad .dot{background:var(--bad)}
.st-ok{background:var(--ok-tint)}.st-ok .dot{background:var(--ok)}
.note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:20px}
/* machine */
.machine{margin:44px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 24px 32px;text-align:center}
.mbig{font-size:clamp(36px,6vw,50px);line-height:1.3;margin:0 0 28px}
.chain{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 40px}
.cline{white-space:nowrap;font-size:clamp(22px,4.4vw,32px);line-height:1.35;padding:6px 18px;border-radius:10px}
.cline.last{background:var(--soft);font-weight:500}
.carr{height:30px;display:flex;align-items:center;justify-content:center}
.carr svg{display:block}
.arrp{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cnote{font-family:var(--sans);font-size:15px;color:var(--muted);margin-left:10px}
.pipe{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap}
.pnode{display:flex;flex-direction:column;align-items:center;min-width:64px}
.pk{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pv2{font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums}
.pin-n .pv2{color:var(--inside)}
.pku{text-transform:none;font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;letter-spacing:0}
.pbox{display:flex;flex-direction:column;align-items:center;padding:10px 16px;border-radius:12px;min-width:104px}
.pbox .pf{font-size:26px}
.pin{background:var(--inside-tint);border-bottom:3px solid var(--inside)}
.pin .pk{color:var(--inside)}
.pout{border:2px solid var(--outside)}
.pout .pk{color:var(--outside)}
.parr{flex:none;width:24px;height:2px;background:var(--muted);position:relative}
.parr::after{content:'';position:absolute;right:-1px;top:-4px;border-left:8px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent}
.pick{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 26px;font-family:var(--sans);font-size:16px;color:var(--muted)}
.chip-s{font-family:var(--serif);font-size:19px;min-width:48px;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip-s.on{background:var(--k-tint);color:var(--ink);border-color:var(--k-line);box-shadow:inset 0 -2px 0 var(--k-line);font-weight:600}
.mu{margin:28px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:21px}
/* highlighter */
.hl{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hl-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));border-bottom:1px solid var(--line)}
.hl-tab{font-size:19px;min-height:56px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--muted);cursor:pointer;padding:6px 8px;position:relative}
.hl-tab:last-child{border-right:0}
.hl-tab.cur{background:var(--bg);color:var(--ink)}
.hl-tab.cur::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--ink)}
.hl-tab.done{color:var(--ink)}
.hl-tab.done::before{content:'\2713';position:absolute;top:3px;right:7px;font-family:var(--sans);font-size:11px;color:var(--ok)}
.hl-stage{padding:34px 26px 32px;text-align:center}
.hl-count{font-family:var(--sans);font-size:15px;color:var(--muted)}
.hl-formula{font-size:clamp(40px,7vw,62px);line-height:1.3;margin:4px 0 18px}
.hl-formula.solved .in{animation:lift .7s cubic-bezier(.2,.8,.2,1) both;background:var(--inside-tint);border-radius:4px}
.hl-formula.solved .out{animation:fadein .7s .15s both}
.hl-ask{font-size:21px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:460px;margin:0 auto}
.chip{font-size:26px;min-height:62px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}
.chip:hover{border-color:var(--inside);transform:translateY(-1px)}
.chip.wrong{border-color:var(--outside);border-style:dashed}
.hl .fb{max-width:500px;margin:18px auto 0;text-align:left}
.hl-out{max-width:500px;margin:0 auto;text-align:left}
.hl-line{margin:0 0 8px;font-size:23px}
.hl-note{font-size:19px;color:var(--muted);margin-top:10px}
.hl-out .btn{margin-top:14px}
.hl-done{margin-top:20px;font-size:20px}
/* rule */
.rule{margin:44px 0 0;padding:48px 32px 40px;background:var(--surface);border:2px solid var(--ink);border-radius:18px;text-align:center;position:relative}
.rule-name{font-size:clamp(40px,6.5vw,56px);line-height:1.05;font-weight:500;margin:0 0 6px}
.memo{display:flex;justify-content:center;margin:14px 0 16px}
.memo span{position:relative;display:inline-block;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--outside);background:var(--outside-tint);border:1.5px solid var(--outside);border-radius:999px;padding:5px 16px}
.memo span::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--outside)}
.rule-eq{white-space:nowrap;overflow-x:auto;font-size:clamp(19px,4.4vw,42px);line-height:1.4;padding:22px 12px;background:var(--bg);border-radius:12px}
.rule-words{margin:26px auto 0;max-width:30em;font-size:22px}
.rule-u{margin:14px auto 0;max-width:32em;font-family:var(--sans);font-size:17px;color:var(--muted)}
.rule-u .mn,.rule-u .mv,.rule-u .mf,.rule-u .mo{font-size:20px}
/* why */
.whyd{margin:44px auto 0;max-width:760px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 24px}
.whyd summary,.hintd summary{list-style:none}
.whyd summary::-webkit-details-marker,.hintd summary::-webkit-details-marker{display:none}
.whyd summary{font-family:var(--sans);font-size:18px;font-weight:600;cursor:pointer;min-height:58px;display:flex;align-items:center;gap:10px}
.opt{font-weight:400;color:var(--muted)}
.chev{margin-left:auto;width:12px;height:12px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s;flex:none}
details[open] > summary .chev{transform:translateY(3px) rotate(225deg)}
.hintd summary{gap:10px}
.hintd summary .chev{margin-left:0;width:9px;height:9px;border-width:2px}
.whyd ul{margin:4px 0 18px;padding-left:1.2em;font-size:19px}
.whyd li{margin-bottom:10px}
/* forms */
.forms{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 26px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:26px}
.frow:first-child{border-top:0}
.fl{text-align:right}
.feq{color:var(--muted)}
/* exam */
.exam-q{font-size:23px}
.msol{margin:16px 0 0;padding-left:1.3em;font-size:21px}
.msol li{margin-bottom:10px}
.self{border:1px solid var(--line);border-radius:12px;padding:12px 18px 8px;margin:20px 0 0}
.self legend{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted);padding:0 6px}
.ck{display:flex;align-items:center;gap:12px;min-height:46px;font-family:var(--sans);font-size:18px;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--ink);flex:none}
/* close */
.closer h3{font-size:28px;margin:8px 0 14px}
.closer .rules{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 22px}
.reads{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:20px}
.reveal{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lift{0%{background:transparent}40%{background:var(--inside-tint);box-shadow:0 0 0 6px var(--inside-tint)}100%{background:var(--inside-tint)}}
@keyframes fadein{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media (max-width:860px){.toc{display:none}}
@media (max-width:900px){.srow,.srow.fixrow{grid-template-columns:24px minmax(0,1fr)}.snum{padding-top:2px}.slabel{padding-top:0}.sval,.fixcol{grid-column:2}.fixbtn{width:auto}}
@media (max-width:640px){
body{font-size:19px}
.page{padding:0 16px 110px}
.bar{margin:0 -16px;padding:0 16px}
.hero{padding:52px 0 16px}
.dek{font-size:20px}
.prob,.scard,.exam{padding:22px 16px 18px}
.pmath{font-size:25px}
.pipe{flex-direction:column;gap:6px}
.parr{width:2px;height:18px}
.parr::after{right:-4px;top:auto;bottom:-1px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid var(--muted);border-bottom:0}
.hl-stage{padding:26px 14px}
.hl-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.hl-tab{border-bottom:1px solid var(--line)}
.sbox{font-size:23px}
.frow{font-size:21px;gap:8px}
.rules li{grid-template-columns:minmax(0,1fr)}
.newtag{grid-column:1}
.sec{padding-top:96px}
.sec-n{font-size:46px}
.rule{padding:30px 16px 26px}
}
</style>

</head>
<body>
<template id="dc-tpl">

<div class="page">
<header class="bar">
<div class="bar-in">
<a class="brand" href="#top">The chain rule</a>
<nav class="toc" aria-label="Sections"><a href="#warm">Warm-up</a><a href="#m1">The inside</a><a href="#m2">The rule</a><a href="#m3">Harder examples</a><a href="#exam">Rehearsal</a></nav>
<sc-if value="{{rulesOpen}}" hint-placeholder-val="{{ false }}"><button type="button" class="scrim" aria-label="Close your rules" onClick="{{closeRules}}"></button></sc-if>
<button type="button" class="rulesbtn" aria-expanded="{{rulesOpenStr}}" aria-controls="rules-panel" onClick="{{toggleRules}}">Your rules <span class="n">{{ruleCount}}</span></button>
<sc-if value="{{rulesOpen}}" hint-placeholder-val="{{ false }}">
<div class="drawer reveal" id="rules-panel" role="region" aria-label="Your rules so far">
<p class="cap">Your rules so far</p>
<ul class="rules"><sc-for list="{{ruleList}}" as="r" hint-placeholder-count="8"><li class="{{r.cls}}"><span class="rname">{{r.name}}</span><span class="rf"><sc-for list="{{r.f}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></span></li></sc-for></ul>
</div>
</sc-if>
</div>
</header>

<main id="top">
<header class="hero col">
<p class="kicker">Calculus I · Derivatives</p>
<h1>The chain rule</h1>
<p class="dek">How to differentiate a function that sits inside another function.</p>
<figure class="emblem" aria-label="The function three x plus one, raised to the fifth power. Three x plus one is the inside; the fifth power is the outside.">
<div class="emb-row" aria-hidden="true"><span class="emb-out">(</span><span class="emb-in"><span class="mn">3</span><span class="mv">x</span><span class="mo"> + </span><span class="mn">1</span></span><span class="emb-out">)</span><span class="emb-sup">5</span></div>
<figcaption class="emb-legend"><span class="leg leg-in"><span class="sw sw-in"></span><span><b>Inside</b>, computed first</span></span><span class="leg leg-out"><span class="sw sw-out"></span><span><b>Outside</b>, applied next</span></span></figcaption>
</figure>
</header>

<sc-for list="{{blocks}}" as="b" hint-placeholder-count="6">

<sc-if value="{{b.isSec}}"><div class="col sec" id="{{b.id}}"><div class="sec-top"><sc-if value="{{b.hasNum}}"><span class="sec-n">{{b.num}}</span></sc-if><h2>{{b.title}}</h2></div><sc-if value="{{b.hasLede}}"><p class="lede"><sc-for list="{{b.lede}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p></sc-if></div></sc-if>

<sc-if value="{{b.isProse}}"><div class="col prose"><sc-if value="{{b.hasTitle}}"><h3>{{b.title}}</h3></sc-if><sc-for list="{{b.paras}}" as="pa"><p><sc-for list="{{pa.segs}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p></sc-for></div></sc-if>

<sc-if value="{{b.isProbs}}"><div class="probs">
<sc-for list="{{b.items}}" as="p">
<article class="prob {{p.cls}}" id="{{p.anchor}}">
<div class="prob-head"><sc-if value="{{p.hasLabel}}"><span class="plabel">{{p.label}}</span></sc-if><span class="ptask">{{p.task}}</span><span class="pmath"><sc-for list="{{p.prompt}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></span></div>
<sc-if value="{{p.locked}}"><p class="locked">{{p.lockText}}</p></sc-if>
<sc-if value="{{p.open}}"><div class="work">
<sc-if value="{{p.hasHint}}"><details class="hintd"><summary><span>Hint</span><span class="chev" aria-hidden="true"></span></summary><p><sc-for list="{{p.hint}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p></details></sc-if>
<div class="ansrow"><span class="lhs" aria-hidden="true"><span class="mv">f</span><span class="mn">′(</span><span class="mv">x</span><span class="mn">) =</span></span><input class="minput" type="text" id="{{p.id}}" value="{{p.val}}" onChange="{{p.change}}" onFocus="{{p.focus}}" onSelect="{{p.sel}}" onKeyDown="{{p.key}}" aria-label="{{p.aria}}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button type="button" class="btn" onClick="{{p.check}}">Check</button></div>
<sc-if value="{{p.showPal}}"><div class="pal" role="group" aria-label="Math keys"><sc-for list="{{p.keys}}" as="k"><button type="button" class="key" aria-label="{{k.aria}}" onMouseDown="{{k.hold}}" onClick="{{k.press}}">{{k.label}}</button></sc-for></div></sc-if>
<sc-if value="{{p.hasPv}}"><div class="pv"><sc-for list="{{p.pv}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div></sc-if>
<div class="fb {{p.fbCls}}" aria-live="polite"><sc-for list="{{p.fb}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div>
<sc-if value="{{p.canReveal}}"><div class="aft"><button type="button" class="link" onClick="{{p.reveal}}">{{p.revealLabel}}</button></div></sc-if>
<sc-if value="{{p.showSol}}"><div class="sol reveal"><p class="cap">Solution</p><sc-for list="{{p.sol}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div></sc-if>
<sc-if value="{{p.hasRep}}"><div class="repair reveal" role="region" aria-label="{{p.repName}}">
<p class="cap">{{p.repName}}</p>
<p class="diag"><sc-for list="{{p.repDiag}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<p class="cap2">Your problem, done right</p>
<p><sc-for list="{{p.sol}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<p class="cap2">One more of the same kind</p>
<div class="prob-head"><span class="ptask">Find the derivative of</span><span class="pmath"><sc-for list="{{p.rp.prompt}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></span></div>
<div class="ansrow"><span class="lhs" aria-hidden="true"><span class="mv">f</span><span class="mn">′(</span><span class="mv">x</span><span class="mn">) =</span></span><input class="minput" type="text" id="{{p.rp.id}}" value="{{p.rp.val}}" onChange="{{p.rp.change}}" onFocus="{{p.rp.focus}}" onSelect="{{p.rp.sel}}" onKeyDown="{{p.rp.key}}" aria-label="{{p.rp.aria}}" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="btn" onClick="{{p.rp.check}}">Check</button></div>
<sc-if value="{{p.rp.showPal}}"><div class="pal" role="group" aria-label="Math keys"><sc-for list="{{p.keys}}" as="k"><button type="button" class="key" aria-label="{{k.aria}}" onMouseDown="{{k.hold}}" onClick="{{k.press}}">{{k.label}}</button></sc-for></div></sc-if>
<sc-if value="{{p.rp.hasPv}}"><div class="pv"><sc-for list="{{p.rp.pv}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div></sc-if>
<div class="fb {{p.rp.fbCls}}" aria-live="polite"><sc-for list="{{p.rp.fb}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div>
<sc-if value="{{p.rp.canReveal}}"><div class="aft"><button type="button" class="link" onClick="{{p.rp.reveal}}">Show the solution</button></div></sc-if>
<sc-if value="{{p.rp.showSol}}"><div class="sol reveal"><sc-for list="{{p.rp.sol}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div></sc-if>
</div></sc-if>
</div></sc-if>
</article>
</sc-for>
</div></sc-if>

<sc-if value="{{b.isMachine}}"><div class="col"><figure class="machine">
<p class="mbig"><sc-for list="{{b.big}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<div class="chain" aria-live="polite">
<sc-for list="{{b.steps}}" as="st">
<sc-if value="{{st.arrow}}"><div class="carr" aria-hidden="true"><svg width="18" height="26" viewBox="0 0 18 26"><path class="arrp" d="M9 2 V22 M3 16 L9 22 L15 16"></path></svg></div></sc-if>
<div class="cline {{st.cls}}"><sc-for list="{{st.segs}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div>
</sc-for>
</div>
<div class="pick" role="group" aria-label="Choose a value of x to plug in"><span>Try another x:</span><sc-for list="{{b.opts}}" as="o"><button type="button" class="chip-s {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.press}}">x = {{o.v}}</button></sc-for></div>
<div class="pipe">
<div class="pnode"><span class="pk"><span class="pku">x</span></span><span class="pv2"><span class="k">{{b.x}}</span></span></div>
<span class="parr" aria-hidden="true"></span>
<div class="pbox pin"><span class="pk">inside (<span class="pku">u</span>)</span><span class="pf"><span class="mn">3</span><span class="mv">x</span><span class="mo"> + </span><span class="mn">1</span></span></div>
<span class="parr" aria-hidden="true"></span>
<div class="pnode pin-n"><span class="pk">inside (<span class="pku">u</span>)</span><span class="pv2">{{b.u}}</span></div>
<span class="parr" aria-hidden="true"></span>
<div class="pbox pout"><span class="pk">outside</span><span class="pf"><span class="mv">u</span><sup class="ms">2</sup></span></div>
<span class="parr" aria-hidden="true"></span>
<div class="pnode"><span class="pk"><span class="pku">f</span>(<span class="pku">x</span>)</span><span class="pv2">{{b.y}}</span></div>
</div>
<p class="mu"><sc-for list="{{b.u1}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
</figure></div></sc-if>

<sc-if value="{{b.isHL}}"><div class="col"><div class="hl">
<div class="hl-tabs" role="group" aria-label="Choose a function"><sc-for list="{{b.tabs}}" as="tb"><button type="button" class="hl-tab {{tb.cls}}" aria-current="{{tb.cur}}" aria-label="{{tb.aria}}" onClick="{{tb.go}}"><sc-for list="{{tb.segs}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></button></sc-for></div>
<div class="hl-stage">
<p class="hl-count">{{b.count}}</p>
<div class="hl-formula {{b.formCls}}"><sc-for list="{{b.formula}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div>
<sc-if value="{{b.unsolved}}"><div>
<p class="hl-ask">Which is the inside?</p>
<div class="chips"><sc-for list="{{b.choices}}" as="c"><button type="button" class="chip {{c.cls}}" onClick="{{c.pick}}"><sc-for list="{{c.segs}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></button></sc-for></div>
<sc-if value="{{b.hasWrong}}"><p class="fb fb-no" role="status"><sc-for list="{{b.wrong}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p></sc-if>
</div></sc-if>
<sc-if value="{{b.solved}}"><div class="hl-out reveal" role="status">
<p class="fb fb-ok" style="margin: 0 0 10px; font-size: 19px">Correct.</p>
<p class="hl-line"><sc-for list="{{b.l1}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<p class="hl-line"><sc-for list="{{b.l2}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<sc-if value="{{b.hasNote}}"><p class="hl-note"><sc-for list="{{b.note}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p></sc-if>
<sc-if value="{{b.hasNext}}"><button type="button" class="btn" onClick="{{b.next}}">Next function</button></sc-if>
</div></sc-if>
<sc-if value="{{b.allDone}}"><p class="hl-done">All six have the same shape: an outside acting on an inside.</p></sc-if>
</div>
</div></div></sc-if>

<sc-if value="{{b.isRule}}"><div class="col"><figure class="rule">
<h3 class="rule-name">The chain rule</h3>
<p class="memo"><span>Memorize this</span></p>
<div class="rule-eq"><sc-for list="{{b.eq}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div>
<p class="rule-words"><sc-for list="{{b.words}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<p class="rule-u"><sc-for list="{{b.uline}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
</figure></div></sc-if>

<sc-if value="{{b.isWhy}}"><details class="whyd">
<summary><span>Why does this work? <span class="opt">(Optional)</span></span><span class="chev" aria-hidden="true"></span></summary>
<ul>
<li>For a visual explanation, watch <a href="https://www.youtube.com/watch?v=YG15m2VwSjA" target="_blank" rel="noopener">this video from the start to 1:48</a>, then <a href="https://www.youtube.com/watch?v=YG15m2VwSjA&amp;t=521s" target="_blank" rel="noopener">from 8:41 to the end</a>.</li>
<li>For an algebraic explanation, read <a href="https://tutorial.math.lamar.edu/classes/calci/DerivativeProofs.aspx#Extras_DerPf_ChainRule" target="_blank" rel="noopener">the proof of the chain rule in Paul’s Online Math Notes</a>.</li>
</ul>
</details></sc-if>

<sc-if value="{{b.isCard}}"><div class="col"><article class="scard" id="{{b.anchor}}">
<p class="cap">{{b.cap}}</p>
<p class="ctitle"><sc-for list="{{b.title}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<div class="srows"><sc-for list="{{b.rows}}" as="r">
<div class="srow {{r.cls}}">
<span class="snum" aria-hidden="true">{{r.n}}</span>
<label class="slabel" for="{{r.id}}"><sc-for list="{{r.label}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></label>
<div class="sval">
<sc-if value="{{r.isShown}}"><div><div class="vrow"><div class="sbox {{r.boxCls}}"><sc-for list="{{r.show}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div><span class="bmark" aria-hidden="true"></span></div><sc-if value="{{r.isGiven}}"><span class="gtag">Given</span></sc-if></div></sc-if>
<sc-if value="{{r.isInput}}"><div>
<div class="vrow"><input class="minput" type="text" id="{{r.id}}" value="{{r.val}}" onChange="{{r.change}}" onFocus="{{r.focus}}" onSelect="{{r.sel}}" onKeyDown="{{r.key}}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="bmark" aria-hidden="true">{{r.mark}}</span></div>
<sc-if value="{{r.showPal}}"><div class="pal" role="group" aria-label="Math keys"><sc-for list="{{r.keys}}" as="k"><button type="button" class="key" aria-label="{{k.aria}}" onMouseDown="{{k.hold}}" onClick="{{k.press}}">{{k.label}}</button></sc-for></div></sc-if>
<sc-if value="{{r.hasPv}}"><div class="pv"><sc-for list="{{r.pv}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div></sc-if>
<div class="fb {{r.fbCls}}" aria-live="polite"><sc-for list="{{r.fb}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div>
<div class="rowacts"><button type="button" class="btn sm" onClick="{{r.check}}">Check</button><sc-if value="{{r.canShow}}"><button type="button" class="link" onClick="{{r.showAns}}">Show this row</button></sc-if></div>
</div></sc-if>
</div>
</div>
</sc-for></div>
</article></div></sc-if>

<sc-if value="{{b.isFix}}"><div class="col"><article class="scard" id="mistake">
<p class="cap">Find the mistake</p>
<p class="ctitle"><sc-for list="{{b.title}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<div class="srows"><sc-for list="{{b.rows}}" as="r">
<div class="srow fixrow">
<span class="snum" aria-hidden="true">{{r.n}}</span>
<label class="slabel" for="{{r.id}}"><sc-for list="{{r.label}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></label>
<div class="sval">
<sc-if value="{{r.notEditing}}"><div><div class="sbox {{r.boxCls}}"><sc-for list="{{r.show}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div><sc-if value="{{r.hasTag}}"><span class="etag">{{r.tag}}</span></sc-if></div></sc-if>
<sc-if value="{{r.editing}}"><div>
<input class="minput" type="text" id="{{r.id}}" value="{{r.val}}" onChange="{{r.change}}" onFocus="{{r.focus}}" onSelect="{{r.sel}}" onKeyDown="{{r.key}}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="{{r.aria}}">
<sc-if value="{{r.showPal}}"><div class="pal" role="group" aria-label="Math keys"><sc-for list="{{r.keys}}" as="k"><button type="button" class="key" aria-label="{{k.aria}}" onMouseDown="{{k.hold}}" onClick="{{k.press}}">{{k.label}}</button></sc-for></div></sc-if>
<sc-if value="{{r.hasPv}}"><div class="pv"><sc-for list="{{r.pv}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></div></sc-if>
<sc-if value="{{r.hasErr}}"><p class="fb fb-err">{{r.err}}</p></sc-if>
<div class="rowacts"><button type="button" class="btn sm" onClick="{{r.evaluate}}">Evaluate</button><button type="button" class="btn sm ghost" onClick="{{r.cancel}}">Cancel</button></div>
</div></sc-if>
</div>
<div class="fixcol"><button type="button" class="fixbtn" disabled="{{r.dis}}" onClick="{{r.fix}}">Fix this row</button></div>
</div>
</sc-for></div>
<div class="status {{b.stCls}}" role="status"><span class="dot" aria-hidden="true"></span><span><sc-for list="{{b.stMsg}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></span></div>
<sc-if value="{{b.canReset}}"><div class="aft"><button type="button" class="link" onClick="{{b.reset}}">Start this example over</button></div></sc-if>
</article></div></sc-if>

<sc-if value="{{b.isForms}}"><div class="col"><div class="forms" role="list"><sc-for list="{{b.rows}}" as="fr"><div class="frow" role="listitem"><span class="fl"><sc-for list="{{fr.l}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></span><span class="feq">=</span><span class="fr"><sc-for list="{{fr.r}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></span></div></sc-for></div></div></sc-if>

<sc-if value="{{b.isExam}}"><div class="col"><article class="exam">
<p class="cap">As an exam would set it</p>
<p class="exam-q"><sc-for list="{{b.q}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></p>
<sc-if value="{{b.closed}}"><div><p class="muted">Work it on paper first, every step written out.</p><button type="button" class="btn" onClick="{{b.open}}">I have written it out</button></div></sc-if>
<sc-if value="{{b.isOpen}}"><div class="reveal">
<p class="cap">Model solution</p>
<ol class="msol"><sc-for list="{{b.lines}}" as="ln"><li><sc-for list="{{ln.segs}}" as="g"><sc-if value="{{g.sup}}"><sup class="{{g.cls}}">{{g.s}}</sup></sc-if><sc-if value="{{g.nsup}}"><span class="{{g.cls}}">{{g.s}}</span></sc-if></sc-for></li></sc-for></ol>
<fieldset class="self"><legend>Does your written solution show each of these?</legend>
<sc-for list="{{b.checks}}" as="ck"><label class="ck"><input type="checkbox" checked="{{ck.on}}" onChange="{{ck.toggle}}"><span>{{ck.text}}</span></label></sc-for>
</fieldset>
<sc-if value="{{b.allChecked}}"><p class="note">All three are there: the whole method, in the form an exam expects.</p></sc-if>
</div></sc-if>
</article></div></sc-if>

    const R = role ? ' ' + role : '';
    const push = (k, txt, opd) => {
      if (ctx.sp && ctx.prev === 'opd' && opd) out.push({ s: ' ', cls: 'mn' + R, sup: false, nsup: true });
      ctx.sp = false;
      out.push({ s: txt, cls: k + R, sup: false, nsup: true });
    };
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ') { ctx.sp = true; i++; continue; }
      if (c === '^') {
        i++;
        let g = '';
        if (s[i] === '(') {
          let d = 0, j = i;
          for (; j < s.length; j++) { if (s[j] === '(') d++; else if (s[j] === ')') { d--; if (d === 0) break; } }
          g = s.slice(i + 1, j); i = j + 1;
        } else {
          let j = i;
          if (s[j] === '-' || s[j] === '−') j++;
          if (/[0-9.]/.test(s[j] || '')) { while (j < s.length && /[0-9.]/.test(s[j])) j++; }
          else if (/[a-zA-Z]/.test(s[j] || '')) { const w = W.find((k) => s.startsWith(k, j)); j += w ? w.length : 1; }

      if (/[0-9.]/.test(c)) {

        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        push('mn', s.slice(i, j), true); i = j; ctx.prev = 'opd';
        continue;
      }
      if (/[a-zA-Z]/.test(c)) {
        const w = W.find((k) => s.startsWith(k, i));
        if (w) {
          i += w.length;
          if (w === 'pi') { push('mn', 'π', true); ctx.prev = 'opd'; }
          else if (w === 'sqrt') { push('mn', '√', true); ctx.prev = 'op'; }
          else if (w === 'let') { push('mf', 'let ', true); ctx.prev = 'op'; }

        }
        push('mv', c, true); i++; ctx.prev = 'opd';
        continue;
      }
      if (c === '*' || c === '·') { push('mo', ' · ', false); i++; ctx.prev = 'op'; continue; }
      if (c === '×') { push('mo', ' × ', false); i++; ctx.prev = 'op'; continue; }
      if (c === '+') { push('mo', ctx.prev === 'opd' ? ' + ' : '+', false); i++; ctx.prev = 'op'; continue; }
      if (c === '-' || c === '−') { push('mo', ctx.prev === 'opd' ? ' − ' : '−', false); i++; ctx.prev = 'op'; continue; }
      if (c === '=' || c === '>' || c === '<') { push('mo eq', ' ' + c + ' ', false); i++; ctx.prev = 'op'; continue; }
      if (c === '(') { push('mn', '(', true); i++; ctx.prev = 'op'; continue; }
      if (c === ')') { push('mn', ')', false); i++; ctx.prev = 'opd'; continue; }
      if (c === '/') { push('mn', '/', false); i++; ctx.prev = 'op'; continue; }
      if (c === '\'' || c === '′') { push('mn', '′', false); i++; ctx.prev = 'opd'; continue; }
      if (c === '√') { push('mn', '√', true); i++; ctx.prev = 'op'; continue; }
      push('mn', c, false); i++; ctx.prev = 'opd';

  rich(t) {
    if (!t) return [];
    if (this.rcache[t]) return this.rcache[t];
    const out = [];
    const ctx = { prev: '', sp: false };
    String(t).split('`').forEach((part, k) => {
      if (!part) return;
      const ch = this.chunks(part);
      if (k % 2 === 0) {
        ch.forEach((c) => {
          const R = c[1] ? ' ' + c[1] : '';
          c[0].split('*').forEach((bit, j) => { if (bit) out.push({ s: bit, cls: (j % 2 ? 'pr em' : 'pr') + R, sup: false, nsup: true }); });
        });
        ctx.prev = ''; ctx.sp = false;
      } else {
        ch.forEach((c) => {

  /* ---------- input plumbing ---------- */
  setAns(id, v) {
    const ans = Object.assign({}, this.state.ans); ans[id] = v;
    const res = Object.assign({}, this.state.res);

    this.setState({ ans, res });
  }

  insert(ins, back) {
    const id = this.state.active;
    if (!id) return;
    const v = this.state.ans[id] || '';
    let pos = this.caret[id];
    if (pos == null || pos > v.length) pos = v.length;
    let nv, np;
    if (!ins) { if (pos === 0) return; nv = v.slice(0, pos - 1) + v.slice(pos); np = pos - 1; }
    else { nv = v.slice(0, pos) + ins + v.slice(pos); np = pos + ins.length - (back || 0); }
    this.caret[id] = np;
    this.setAns(id, nv);
    setTimeout(() => { const el = document.getElementById(id); if (el) { try { el.focus(); el.setSelectionRange(np, np); } catch (e) {} } }, 0);
  }

  io(id, onEnter) {
    return {
      val: this.state.ans[id] || '',
      change: (e) => { this.caret[id] = e.target.selectionStart; this.setAns(id, e.target.value); },
      focus: () => { if (this.state.active !== id) this.setState({ active: id }); },
      sel: (e) => { this.caret[id] = e.target.selectionStart; },

  feedback(id, val, uv) {
    const r = this.state.res[id];
    const fb = r ? { fb: this.rich(r.msg), fbCls: 'fb-' + r.st } : { fb: [], fbCls: '' };
    let pv = [];
    const v = String(val || '');
    if (v.trim() && !(r && r.st === 'ok')) {
      const body = v.indexOf('=') >= 0 ? v.slice(v.lastIndexOf('=') + 1) : v;
      const c = this.compile(body, uv);
      if (!c.err && !c.empty) {

        pv = this.rich('Reads as `' + this.clean(body) + '`.' + warn);

    return Object.assign(fb, { pv, hasPv: pv.length > 0 });

  /* ---------- checking ---------- */
  checkProb(it, mode, setKey) {
    const S = this.state;
    const id = 'in-' + it.id;
    const r = this.judge(it, S.ans[id] || '');
    const res = Object.assign({}, S.res), tries = Object.assign({}, S.tries), done = Object.assign({}, S.done), streak = Object.assign({}, S.streak), unl = Object.assign({}, S.unl), rep = Object.assign({}, S.rep);
    let msg = r.msg || '', st = r.st;
    if (r.st !== 'ok' && r.st !== 'err') tries[id] = (tries[id] || 0) + 1;
    if (mode === 'warm') {

    } else if (mode === 'try') {
      if (r.st === 'ok') { msg = 'Right. That 15 out front is what this page is about. Section 2 shows where it comes from.'; done[id] = true; }
      else if (r.st === 'slip') { msg = 'Most people write this. Something is missing, and the rest of this page is about what.'; st = 'no'; }
      else if (r.st === 'stuck') { msg = 'That is fine. Section 2 shows how to do this one.'; }
      else if (r.st === 'no') { msg = 'Not this one, which is fine for now. Hold on to your answer; Section 2 shows what this derivative needs.'; }
    } else {
      if (r.st === 'ok') {
        msg = it.okMsg || 'Right.';
        if (!done[id]) { done[id] = true; streak[setKey] = (streak[setKey] || 0) + 1; }
      } else if (r.st === 'slip' && r.tag) {

        streak[setKey] = 0;

      } else if (r.st !== 'err') {

          if (r.st === 'stuck') msg = msg.replace(/^Not yet\. /, '');
        }
        if (r.st !== 'stuck') st = 'no';
      }
      const base = this.D.sets[setKey].filter((x) => !x.unlock);
      if ((streak[setKey] || 0) >= 2 || base.every((x) => done['in-' + x.id])) unl[setKey] = true;
    }
    res[id] = { st, msg };
    this.setState({ res, tries, done, streak, unl, rep });
  }

  checkRep(it) {
    const S = this.state;
    const rp = this.D.REP[S.rep[it.id]];
    const id = 'rep-' + it.id;
    const r = this.judge(rp, S.ans[id] || '');
    const res = Object.assign({}, S.res), tries = Object.assign({}, S.tries), done = Object.assign({}, S.done);
    let msg = r.msg || '', st = r.st === 'slip' ? 'no' : r.st;
    if (r.st === 'ok') { msg = 'Right. Same kind of problem, handled correctly this time.'; done[id] = true; }
    else if (r.st !== 'err') { tries[id] = (tries[id] || 0) + 1; if (!msg) msg = (r.st === 'stuck' ? '' : 'Not yet. ') + 'Follow the same steps as the solution just above: name the inside and outside, differentiate the outside, put the inside back, multiply by the inside’s derivative.'; }
    res[id] = { st, msg };
    this.setState({ res, tries, done });
  }

  checkRow(fi, k) {
    const S = this.state;
    const row = fi.rows[k];
    const id = 'fb-' + fi.id + '-' + k;
    const r = this.judge(row, S.ans[id] || '');
    const res = Object.assign({}, S.res), tries = Object.assign({}, S.tries);
    const hint = row.hint || this.D.ROWHINT[Math.min(k, 6)];
    let msg, st = r.st;
    if (r.st === 'ok') msg = 'Right.';
    else if (r.st === 'err') msg = r.msg;
    else if (r.st === 'stuck') msg = hint;
    else { st = 'no'; msg = r.msg || ('Not yet. ' + hint); }
    if (r.st !== 'ok' && r.st !== 'err') tries[id] = (tries[id] || 0) + 1;
    res[id] = { st, msg };
    const fillDone = Object.assign({}, S.fillDone);
    if (fi.rows.every((rw, j) => rw.given || (j === k ? r.st === 'ok' : (res['fb-' + fi.id + '-' + j] && res['fb-' + fi.id + '-' + j].st === 'ok')))) fillDone[fi.id] = true;
    this.setState({ res, tries, fillDone });
    if (r.st === 'ok') setTimeout(() => { const nx = document.getElementById('fb-' + fi.id + '-' + (k + 1)) || document.getElementById('fb-' + fi.id + '-' + (k + 2)); if (nx && !nx.value) { try { nx.focus(); } catch (e) {} } }, 0);
  }

  showRow(fi, k) {
    const id = 'fb-' + fi.id + '-' + k;
    const ans = Object.assign({}, this.state.ans); ans[id] = fi.rows[k].ans;
    const res = Object.assign({}, this.state.res); res[id] = { st: 'ok', msg: 'Here is this row. Compare it with the hint before moving on.' };
    this.setState({ ans, res });
  }

  /* ---------- views ---------- */
  probView(it, mode, setKey) {
    const S = this.state;
    const id = 'in-' + it.id;
    const tries = S.tries[id] || 0;
    const locked = !!it.unlock && !S.unl[setKey];
    const fb = this.feedback(id, S.ans[id] || '', false);
    const hasRep = !!S.rep[it.id];
    const need = mode === 'do' ? 2 : 1;
    const v = Object.assign({
      id, anchor: 'p-' + it.id, label: it.label || '', hasLabel: !!it.label, task: 'Find the derivative of',
      prompt: this.rich('`f(x) = ' + it.f + '`'),
      cls: (S.done[id] ? 'is-done' : '') + (locked ? ' is-locked' : ''),
      locked, open: !locked, lockText: 'Opens after two right in a row.',

      aria: 'Your derivative of f(x) = ' + it.f, keys: this.PAL,

      showSol: !!S.sol[id] && !hasRep, sol: this.rich(it.sol),

      v.rp = Object.assign({
        id: rid, prompt: this.rich('`f(x) = ' + rp.f + '`'), aria: 'Your derivative of f(x) = ' + rp.f,
        showPal: S.active === rid,

  rowBase(k, extra) {

  }

  workedCard(w) {
    return {
      isCard: true, anchor: w.id, cap: w.cap, title: this.rich(w.title),
      rows: w.rows.map((t, k) => Object.assign(this.rowBase(k, w.extra), { isShown: true, show: this.rich(t) }))

  fillCard(fi) {
    const S = this.state;
    const rows = fi.rows.map((row, k) => {
      if (row.given) return Object.assign(this.rowBase(k, fi.extra), { isShown: true, isGiven: true, boxCls: 'given', show: this.rich(row.given) });
      const id = 'fb-' + fi.id + '-' + k;

  /* find the mistake: rows recompute from one another */
  mkRows() {
    const M = this.D.MK;
    return this.state.mk || M.src.map((s, k) => ({ src: s, disp: M.disp[k], tag: '' }));
  }

  mkEvaluate(k) {
    const M = this.D.MK;
    const text = String(this.state.ans['mk-edit'] || '').trim();
    const c = this.parse(text, M.uv[k]);
    if (c.empty || c.err) { this.setState({ mkErr: c.err || 'Type the corrected row first.' }); return; }
    const rows = this.mkRows().map((r) => Object.assign({}, r));
    rows[k] = { src: text, disp: '`' + this.clean(text) + '`', tag: 'Edited' };
    const changed = new Set([k]);
    const A = (j) => this.parse(rows[j].src, M.uv[j]).ast;
    const set = (j, ast, vn) => {
      if (!ast || this.hasNull(ast)) { rows[j] = { src: rows[j].src, disp: rows[j].disp, tag: rows[j].tag }; return; }
      const s = this.pr(ast, vn).s;
      rows[j] = { src: s, disp: '`' + s + '`', tag: 'Updated from your edit' };
      changed.add(j);
    };
    for (let j = k + 1; j < 6; j++) {
      if (!M.deps[j].some((d) => changed.has(d))) continue;
      try {
        if (j === 2) set(2, this.simp(this.diff(A(1))), 'u');
        if (j === 3) set(3, this.simp(this.subst(A(2), A(0))), 'x');
        if (j === 4) set(4, this.simp(this.diff(A(0))), 'x');
        if (j === 5) set(5, this.simp({ k: '*', a: A(3), b: A(4) }), 'x');
      } catch (e) {}
    }
    const ans = Object.assign({}, this.state.ans); delete ans['mk-edit'];
    this.setState({ mk: rows, mkEdit: null, mkErr: '', ans });
  }

  mistakeCard() {
    const S = this.state, M = this.D.MK;
    const rows = this.mkRows();
    const editing = S.mkEdit;
    const f6 = this.compile(rows[5].src, false).f;
    const right = this.same(f6, this.cf(M.ans, false));
    const f4 = this.compile(rows[3].src, false).f, f5 = this.compile(rows[4].src, false).f;
    const consistent = this.same(f6, (x) => f4(x) * f5(x));
    const r4ok = this.same(f4, this.cf(M.row4, false));
    const green = right && consistent && r4ok;
    const touched = !!S.mk;
    let st;
    if (green) st = 'Final answer: right. Row 4 was the mistake. Putting the inside back means replacing `{u}` with the inside, `{x^2 + 1}`; the student put in the inside’s derivative, `2x`, instead. So `f′(x) = 3(x^2 + 1)^2 · 2x = 6x(x^2 + 1)^2`.';
    else if (right) st = 'Row 6 now shows the right answer, but it no longer follows from multiplying rows 4 and 5. Fix the row where the mistake starts, and let the rows below update from it.';
    else st = touched ? 'Final answer: still wrong. Look for the first row that does not follow from the rows above it.' : 'Final answer: wrong. Find the row where the mistake starts, and fix it.';
    return {
      isFix: true,
      title: this.rich('A student found the derivative of `f(x) = ' + M.f + '`. Their final answer is wrong. Find the row where the mistake starts and fix it.'),
      rows: rows.map((r, k) => {
        const isEd = editing === k;
        const base = Object.assign(this.rowBase(k), {
          id: isEd ? 'mk-edit' : '', editing: isEd, notEditing: !isEd,
          show: this.rich(r.disp), boxCls: (k === 5 ? (green ? 'good' : 'bad') : '') + (editing != null && !isEd ? ' dim' : ''),
          hasTag: !!r.tag, tag: r.tag || '', dis: editing != null,
          fix: () => { const ans = Object.assign({}, this.state.ans); ans['mk-edit'] = r.src; this.caret['mk-edit'] = r.src.length; this.setState({ mkEdit: k, mkErr: '', ans, active: 'mk-edit' }); setTimeout(() => { const el = document.getElementById('mk-edit'); if (el) { try { el.focus(); } catch (e) {} } }, 0); }
        });
        if (isEd) {
          Object.assign(base, {
            aria: 'Edit row ' + (k + 1), keys: M.uv[k] ? this.PALU : this.PAL, showPal: S.active === 'mk-edit',
            hasErr: !!S.mkErr, err: S.mkErr,
            evaluate: () => this.mkEvaluate(k), cancel: () => { const ans = Object.assign({}, this.state.ans); delete ans['mk-edit']; this.setState({ mkEdit: null, mkErr: '', ans }); }
          }, this.feedback('mk-edit', S.ans['mk-edit'] || '', M.uv[k]), this.io('mk-edit', () => this.mkEvaluate(k)));
        }
        return base;
      }),
      stCls: green ? 'st-ok' : 'st-bad', stMsg: this.rich(st),
      canReset: touched && editing == null, reset: () => this.setState({ mk: null, mkEdit: null, mkErr: '' })
    };
  }

  hlView() {
    const S = this.state, H = this.D.HL;
    const i = Math.min(S.hlI || 0, H.length - 1);

      isHL: true,
      tabs: H.map((x, k) => ({ segs: this.rich('`' + x.show + '`'), cls: (k === i ? 'cur' : '') + (S.hlSolved[k] ? ' done' : ''), cur: k === i ? 'true' : 'false', aria: 'Function ' + (k + 1) + (S.hlSolved[k] ? ', done' : ''), go: () => this.setState({ hlI: k }) })),

      unsolved: !solved, solved,
      choices: h.ch.map((c, k) => ({ segs: this.rich('`' + c + '`'), cls: w === k ? 'wrong' : '', pick: () => {
        if (k === h.ok) { const hs = Object.assign({}, this.state.hlSolved); hs[i] = true; const hw = Object.assign({}, this.state.hlWrong); delete hw[i]; this.setState({ hlSolved: hs, hlWrong: hw }); }
        else { const hw = Object.assign({}, this.state.hlWrong); hw[i] = k; this.setState({ hlWrong: hw }); }
      } })),
      hasWrong: !solved && w != null, wrong: this.rich(w != null ? (h.why[w] || '') : ''),
      l1: this.rich('{Inside}: `{u = ' + h.inn + '}`'),
      l2: this.rich('«Outside»: `«' + h.out + '»`'),
      hasNote: !!h.note, note: this.rich(h.note || ''),
      hasNext: solved && nx >= 0, next: () => { if (nx >= 0) this.setState({ hlI: nx }); },
      allDone: H.every((_, k) => S.hlSolved[k])
    };
  }

  examView() {
    const S = this.state;
    const T = ['I named the inside and the outside.', 'I multiplied by the inside’s derivative, 2x.', 'I simplified to a single term.'];
    return {
      isExam: true,
      q: this.rich('Differentiate `f(x) = (x^2 − 4)^(3/2)` for `x > 2` and simplify to a single term. Show your work.'),
      closed: !S.examOpen, isOpen: !!S.examOpen, open: () => this.setState({ examOpen: true }),
      lines: [
        'Inside `{u = x^2 − 4}`, outside `{u}«^(3/2)»`.',
        'Differentiate the outside: `«(3/2)»{u}«^(1/2)»`. Put the inside back: `«(3/2)(»{x^2 − 4}«)^(1/2)»`.',
        'Differentiate the inside: `{2x}`.',
        'Multiply: `(3/2)(x^2 − 4)^(1/2) · 2x = 3x(x^2 − 4)^(1/2)`.',
        'As a single term: `f′(x) = 3x√(x^2 − 4)`.'
      ].map((t) => ({ segs: this.rich(t) })),
      checks: T.map((t, k) => ({ text: t, on: !!S.checks[k], toggle: () => { const c = this.state.checks.slice(); c[k] = !c[k]; this.setState({ checks: c }); } })),
      allChecked: S.checks.every(Boolean)
    };
  }

  ruleItems(all) {
    const S = this.state;
    const genOn = all || !!(S.fillDone.fexp || S.fillDone.fln || S.done['in-d3a']);
    const list = this.D.BASE.map((r) => ({ name: r[0], f: this.rich(r[1]), isNew: false, cls: '' }));
    this.D.NEW.forEach((r) => { if (r[2] === 'chain' || genOn) list.push({ name: r[0], f: this.rich(r[1]), isNew: true, cls: 'new' }); });
    return list;
  }

  renderVals() {
    const D = this.D;
    const R = (t) => this.rich(t);
    const blocks = [];
    const sec = (id, num, title, lede) => blocks.push({ isSec: true, id, num, hasNum: !!num, title, lede: R(lede || ''), hasLede: !!lede });
    const prose = (paras, title) => blocks.push({ isProse: true, title: title || '', hasTitle: !!title, paras: paras.map((p) => ({ segs: R(p) })) });
    const probs = (key, mode) => blocks.push({ isProbs: true, items: D.sets[key].map((it) => this.probView(it, mode, key)) });

    sec('warm', '', 'Warm-up', 'Three derivatives from earlier units. Not graded.');
    probs('warm', 'warm');

    sec('m1', '1', 'Seeing the inside', 'Try this before any explanation.');
    probs('try', 'try');
    prose(['A *composite* is a function inside a function. The {inside} is the part you would compute first if you plugged in a number. The «outside» is what happens to it next.'], 'A function inside a function');
    blocks.push(this.machineView());
    prose(['For each function, split it into two functions and then pick the part you would compute first.'], 'Find the inside');
    blocks.push(this.hlView());

    sec('m2', '2', 'The rule', '');
    blocks.push({
      isRule: true,
      eq: R('`(«f»({g(x)}))′ = «f′»({g(x)}) · {g′(x)}`'),
      words: R('In words: the derivative of a composite function is the «outside’s derivative», evaluated at the {inside}, times the {inside’s derivative}.'),
      uline: R('“Evaluated at the inside” means: call the inside `{u}`, differentiate the outside as if `{u}` were an ordinary variable, then put the inside back where `{u}` was. Rows 3 and 4 below show it.')
    });
    blocks.push(this.workedCard(D.WORKED[0]));
    blocks.push(this.workedCard(D.WORKED[1]));
    blocks.push({ isWhy: true });
    blocks.push(this.fillCard(D.FILLS.sin));
    blocks.push(this.workedCard(D.WORKED[2]));
    blocks.push(this.fillCard(D.FILLS.exp));
    blocks.push(this.mistakeCard());
    prose([], 'On your own');
    probs('do2', 'do');

    sec('m3', '3', 'Harder examples', '');
    prose(['Every rule you know for `x` works for any inside `{u}`. Each one gains a factor of `{u′}`:']);
    blocks.push({ isForms: true, rows: D.FORMS.map((r) => ({ l: R(r[0]), r: R(r[1]) })) });
    blocks.push(this.fillCard(D.FILLS.ln));
    prose([], 'On your own');
    probs('do3', 'do');

    sec('exam', '', 'Exam rehearsal', '');
    blocks.push(this.examView());

    sec('close', '', 'What you have now', '');
    blocks.push({ isClose: true, rules: this.ruleItems(true) });

    const ruleList = this.ruleItems(false);
    return {
      blocks, ruleList, ruleCount: ruleList.length,
      rulesOpen: !!this.state.rulesOpen, rulesOpenStr: this.state.rulesOpen ? 'true' : 'false',
      toggleRules: () => this.setState({ rulesOpen: !this.state.rulesOpen }),
      closeRules: () => this.setState({ rulesOpen: false })
    };
  }
}

dcMount(Component, {}, document.getElementById('dc-tpl'), document.getElementById('dc-app'));
</script>

<!-- ============================================================================
     APPENDED BY HOSTING CLAUDE, 2026-10-07 -- health-check self-test only.
     Not present in the source file (interactive-lessons/lesson/chain-rule.html),
     which the Note-to-Claudes kit asks not to edit. This block is additive and
     lives ONLY in this hosted copy, to satisfy the Rize interactive-health
     contract (window.__selfCheck() -> {ok, checks}; see SELFCHECK.md in
     swachtel-dev/rize-interactive-health). It reads the page's own rendered
     DOM and drives its real input + button, then restores localStorage so it
     leaves no trace on a student's saved progress.
     ============================================================================ -->
<script>
(function () {
  function byId(id) { return document.getElementById(id); }
  function fire(el, type) { el.dispatchEvent(new Event(type, { bubbles: true })); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  window.SelfCheck = window.SelfCheck || (function () {
    var checks = [];
    return {
      register: function (name, fn) { checks.push({ name: name, fn: fn }); },
      run: async function () {
        var out = [];
        for (var i = 0; i < checks.length; i++) {
          var c = checks[i];
          try {
            var r = await c.fn();
            if (r === true || r === undefined) out.push({ name: c.name, ok: true });
            else if (r === false) out.push({ name: c.name, ok: false, detail: 'returned false' });
            else out.push({ name: c.name, ok: !!r.ok, detail: r.detail });
          } catch (e) {
            out.push({ name: c.name, ok: false, detail: String((e && e.message) || e) });
          }
        }
        return { ok: out.every(function (c) { return c.ok; }), checks: out };
      }
    };
  })();
  window.__selfCheck = function () { return window.SelfCheck.run(); };

  // Text actually rendered for a student to read: body minus <script>,
  // <style> and <template> source (a <script> tag's own text -- e.g. this
  // very harness, or the dc-runtime.js comment describing {{...}} holes --
  // is part of document.body.textContent and would otherwise read as a
  // broken-interpolation false positive).
  function visibleText() {
    var clone = document.body.cloneNode(true);
    var kill = clone.querySelectorAll('script, style, template');
    for (var i = 0; i < kill.length; i++) kill[i].remove();
    return clone.textContent || '';
  }

  // 1. The page's main sections mounted with real content (Preact rendered
  //    the template rather than silently producing an empty shell). Each
  //    sec() div is just a header marker (id + number + title), not a
  //    container for that section's prose, so we check the title rendered,
  //    not the div's full text length -- and separately check the exact
  //    known problem count the page's own data builds (12).
  SelfCheck.register('main sections rendered', function () {
    var ids = ['warm', 'm1', 'm2', 'm3', 'exam', 'close'];
    var missing = ids.filter(function (id) {
      var el = byId(id);
      var h2 = el && el.querySelector('h2');
      return !h2 || !h2.textContent.trim();
    });
    if (missing.length) return { ok: false, detail: 'missing or titleless section(s): ' + missing.join(', ') };
    var probCount = document.querySelectorAll('.prob').length;
    if (probCount !== 12) return { ok: false, detail: 'expected 12 problem cards (3 warm-up, 1 try-first, 8 graded), got ' + probCount };
    return true;
  });

  // 2. Math typeset without errors: the custom typesetter (not MathJax --
  //    this page has no CDN dependency) actually produced <sup> exponents,
  //    and no raw template syntax or NaN/undefined leaked into the
  //    student-visible page.
  SelfCheck.register('math typeset without errors', function () {
    var p1 = byId('p-w1');
    if (!p1) return { ok: false, detail: 'problem p-w1 (f(x) = x^4) not found' };
    var sup = p1.querySelector('.pmath sup');
    if (!sup || !sup.textContent.trim()) {
      return { ok: false, detail: 'exponent in f(x) = x^4 did not typeset as a <sup>' };
    }
    var scope = visibleText();
    if (scope.indexOf('{{') !== -1) {
      return { ok: false, detail: 'unrendered template placeholder ({{...}}) leaked into the rendered page' };
    }
    if (/\bNaN\b|\bundefined\b/.test(scope)) {
      return { ok: false, detail: 'NaN or undefined leaked into the rendered page' };
    }
    return true;
  });

  // 3. The answer checker evaluates a known key correctly, and a known-wrong
  //    answer is not marked correct. Uses warm-up problem 1, f(x) = x^4,
  //    f'(x) = 4x^3. Restores the input and localStorage afterward.
  SelfCheck.register('answer checker grades a known key correctly', async function () {
    var KEY = 'rize-chain-rule-lesson-v4';
    var savedRaw = null;
    try { savedRaw = window.localStorage.getItem(KEY); } catch (e) {}

    var input = byId('in-w1');
    if (!input) return { ok: false, detail: 'input#in-w1 not found' };
    var savedVal = input.value;

    function setVal(v) { var el = byId('in-w1'); el.value = v; fire(el, 'input'); }
    function click() {
      var art = byId('p-w1');
      var btn = art && art.querySelector('.ansrow button.btn');
      if (!btn) throw new Error('Check button for w1 not found');
      fire(btn, 'click');
    }
    function fbClass() {
      var art = byId('p-w1');
      var fb = art && art.querySelector('.fb');
      return fb ? fb.className : '';
    }

    try {
      setVal('4x^3'); // correct derivative of x^4
      click();
      await wait(50);
      var rightCls = fbClass();
      var rightOk = /\bfb-ok\b/.test(rightCls);

      setVal('x^3'); // deliberately wrong
      click();
      await wait(50);
      var wrongCls = fbClass();
      var wrongOk = !/\bfb-ok\b/.test(wrongCls);

      if (!rightOk) return { ok: false, detail: 'correct answer 4x^3 was not marked right (feedback class: "' + rightCls + '")' };
      if (!wrongOk) return { ok: false, detail: 'wrong answer x^3 was marked right (feedback class: "' + wrongCls + '")' };
      return true;
    } finally {
      setVal(savedVal);
      await wait(20);
      try {
        if (savedRaw === null) window.localStorage.removeItem(KEY);
        else window.localStorage.setItem(KEY, savedRaw);
      } catch (e) {}
    }
  });
})();
</script>
